<main class="wrap">
  <header class="head">
    <h1>Projects</h1>
    <p class="muted">
      Three complete projects designed to showcase real product work: UI + logic + structure.
    </p>
  </header>

  <section class="grid">
    <article class="card" *ngFor="let p of projects; trackBy: trackById">
      <div class="top">
        <h3>{{ p.name }}</h3>
        <span class="pill">{{ stackLabel(p) }}</span>
      </div>

      <p class="desc">{{ p.tagline }}</p>

      <div class="meta">
        <span>{{ p.role }}</span>
      </div>

      <div class="actions">
        <!-- Details always -->
        <a [routerLink]="['/projects', p.id]">View details →</a>

        <!-- Live -->
        <a
          class="btn ghost"
          *ngIf="p.links?.live"
          [href]="p.links?.live"
          target="_blank"
          rel="noreferrer"
        >
          Demo
        </a>

        <!-- Repo -->
        <a
          class="btn ghost"
          *ngIf="p.links?.repo"
          [href]="p.links?.repo"
          target="_blank"
          rel="noreferrer"
        >
          Code
        </a>
      </div>
    </article>
  </section>
</main>
